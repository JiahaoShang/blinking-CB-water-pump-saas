<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>卖家授权管理系统｜完整界面线稿</title>
  <style>
    :root{--ink:#202a2e;--muted:#69777d;--line:#d7dedf;--bg:#f4f6f5;--blue:#3657a4;--nav:#192227;--navline:#354149}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}

    .v1{color:#b9c9f2;border-color:#6a80a9}.side-foot{border-top:1px solid var(--navline);padding:15px 8px 0;color:#aec0c4;font-size:10px}.side-foot strong{display:block;color:#fff;font-size:11px;margin-bottom:5px}

    .topbar-left,.topbar-right{display:flex;align-items:center;gap:10px;min-width:0}.crumb{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crumb b{color:var(--ink)}
    .search-button{border:1px solid var(--line);background:#f8faf9;border-radius:5px;color:#77868b;padding:6px 9px;font-size:11px;min-width:205px;text-align:left}kbd{float:right;border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:10px}.mode{font-size:10px;border:1px solid #cbd6ea;color:#405e9d;background:#f1f4fa;padding:4px 7px;border-radius:3px;white-space:nowrap}
    .menu{display:none;border:1px solid var(--line);background:#fff;border-radius:4px;padding:4px 7px}main{max-width:1660px;margin:auto;padding:29px 30px 55px}.screen[hidden]{display:none!important}
    .head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:22px}.kicker{font:700 10px/1.2 ui-monospace,SFMono-Regular,monospace;color:var(--blue);letter-spacing:.12em}
    h1{font-size:25px;letter-spacing:-.035em;margin:6px 0 4px;line-height:1.25}h2{font-size:14px;margin:0;font-weight:670}h3{font-size:11px;margin:0 0 7px}.subtitle{font-size:11px;color:var(--muted);margin:0}.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .btn{border:1px solid #c5cfd2;background:#fff;color:#29363b;border-radius:5px;padding:6px 10px;font-size:11px;font-weight:620;min-height:32px}.btn:hover{background:#f4f7f8}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#29478e}.btn.text{border:0;background:transparent;color:var(--blue)}
    .panel{background:#fff;border:1px solid var(--line);border-radius:7px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 15px;border-bottom:1px solid var(--line);min-height:49px}.panel-body{padding:15px}.note{color:var(--muted);font-size:10px}
    .grid{display:grid;gap:14px}.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.cols-main{grid-template-columns:minmax(0,1.8fr) minmax(265px,.75fr);align-items:start}.cols-half{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.cols-triple{grid-template-columns:230px minmax(0,1fr) 250px;align-items:start}.gap{margin-top:14px}
    .metric{border:1px solid var(--line);background:#fff;padding:14px 16px;border-radius:7px;min-height:90px}.metric span{color:var(--muted);font-size:10px}.metric strong{display:block;margin:8px 0 2px;font:650 24px/1 ui-monospace,SFMono-Regular,monospace}.metric small{color:var(--muted);font-size:10px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:11px}.field{border:1px solid var(--line);background:#fff;border-radius:5px;padding:6px 9px;color:#4f5c61;font-size:11px;min-height:32px}.field.long{min-width:220px}
    .table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:11px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #e7ebeb;vertical-align:middle}th{background:#fafbfb;color:#7a898d;font-weight:650;white-space:nowrap}tbody tr:last-child td{border-bottom:0}tr[data-go]{cursor:pointer}tr[data-go]:hover{background:#f4f7fb}
    .mono{font:500 10px/1.5 ui-monospace,SFMono-Regular,monospace}.muted{color:var(--muted)}.badge{display:inline-block;font-size:10px;border:1px solid #cfd8da;background:#f8faf9;color:#546166;padding:2px 6px;border-radius:3px;white-space:nowrap}
    .badge.blue{border-color:#cad6ef;background:#f3f6fd;color:#3a599c}.badge.amber{border-color:#ead7ae;background:#fffbf2;color:#7b581b}.badge.green{border-color:#c9dfd0;background:#f5faf6;color:#306b4f}.badge.red{border-color:#e7c9c8;background:#fff8f7;color:#9a4c43}
    .link{border:0;background:none;color:var(--blue);padding:0;text-decoration:underline;text-underline-offset:2px;font-size:11px}.list{margin:0;padding:0;list-style:none}.list li{padding:11px 15px;border-bottom:1px solid #e8eded;font-size:11px}.list li:last-child{border-bottom:0}.list strong{display:block}.list small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
    .flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:15px}.flow span{border:1px dashed #becbcf;border-radius:4px;padding:7px 9px;background:#fafbfb;font-size:10px}.flow b{font-weight:400;color:#92a2a7}
    .kv{display:grid;grid-template-columns:95px minmax(0,1fr);gap:9px 10px;font-size:11px}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:560}.rule{border-top:1px solid var(--line);margin:14px 0}.callout{padding:10px 12px;border:1px solid #d8e0e2;border-left:3px solid #7d95ba;background:#fafbfd;border-radius:4px;color:#526167;font-size:11px}.callout.warn{border-left-color:#b6883b;background:#fffdf8}
    .document{height:405px;border:1px solid #cad4d7;background:#fbfbfa;margin:14px;padding:18px;font-size:11px}.doc-title{font-weight:700;letter-spacing:.08em;border-bottom:2px solid #aebcc0;padding-bottom:9px}.line{height:7px;background:#e2e8e8;border-radius:2px;margin:12px 0}.line.short{width:45%}.line.mid{width:70%}.highlight{border:1px dashed #7890c3;background:#edf2fc;padding:10px;margin:17px 0}
    .fact{display:grid;grid-template-columns:105px minmax(0,1fr) auto;gap:6px;padding:11px 0;border-bottom:1px solid #e8eeee;font-size:11px}.fact:last-child{border-bottom:0}.fact span:first-child{color:var(--muted)}.fact strong{display:block}.fact small{color:var(--muted);font-size:10px}
    .wire{border:1px dashed #bac6c9;background:#f8faf9;border-radius:4px;padding:13px;color:#718187;text-align:center;font-size:11px}.wire.tall{height:95px;display:grid;place-items:center}.wire.medium{height:60px;display:grid;place-items:center}.wire-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
    .inbox-item{border-bottom:1px solid #e8eeee;padding:12px;cursor:pointer;font-size:11px}.inbox-item.selected,.inbox-item:hover{background:#f3f6fb}.inbox-item strong{display:block}.inbox-item small{color:var(--muted);font-size:10px}.timeline{list-style:none;padding:0 0 0 15px;margin:0;border-left:1px solid #c4cfd3}.timeline li{position:relative;margin:0 0 18px;padding-left:14px;font-size:11px}.timeline li:before{content:"";position:absolute;left:-20px;top:4px;width:8px;height:8px;border:1px solid #97a8ae;border-radius:50%;background:#fff}.timeline li:last-child{margin-bottom:0}.timeline strong{display:block}.timeline small{color:var(--muted)}
    .quote{border:1px solid #d6dfe2;border-left:3px solid #90a2c5;background:#fafbfc;padding:11px;font-size:11px;line-height:1.7;margin:9px 0}.check{border-bottom:1px solid #e9eeee;padding:9px 0;font-size:11px}.check:last-child{border-bottom:0}textarea.field{width:100%;min-height:95px;resize:vertical}
    .role td:not(:first-child),.role th:not(:first-child){text-align:center}.empty{border:1px dashed #c3ced1;background:#fafbfb;border-radius:6px;padding:55px 20px;text-align:center;min-height:235px}.empty strong{display:block;font-size:15px}.empty p{max-width:490px;margin:7px auto 0;color:var(--muted);font-size:11px}
    .fineprint{font-size:10px;color:#77868a;margin-top:15px}.toast{position:fixed;right:18px;bottom:18px;background:#203139;color:white;border-radius:5px;padding:10px 13px;max-width:340px;font-size:11px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:50}.toast.show{opacity:1;transform:translateY(0)}
    .overlay{display:none;position:fixed;inset:0;background:#16242aa3;padding:13vh 16px;z-index:40}.overlay.open{display:block}.command{max-width:490px;margin:auto;background:#fff;border:1px solid #a8b9bf;border-radius:8px;overflow:hidden}.command input{width:100%;padding:14px;border:0;border-bottom:1px solid var(--line);outline:0}.command-list{padding:7px;max-height:310px;overflow:auto}.command-list button{display:flex;width:100%;justify-content:space-between;border:0;background:#fff;padding:9px;border-radius:4px;text-align:left;font-size:11px}.command-list button:hover{background:#f2f5f9}.command-foot{border-top:1px solid var(--line);padding:8px 12px;background:#fafbfb;color:var(--muted);font-size:10px}
    @media(max-width:1200px){.cols-triple{grid-template-columns:225px minmax(0,1fr)}.context{grid-column:1/-1}.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;width:240px;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0);box-shadow:8px 0 30px #1118}.menu{display:block}.topbar{padding:0 14px}main{padding:21px 15px}.cols-main,.cols-half,.cols-triple{grid-template-columns:1fr}.context{grid-column:auto}}
    @media(max-width:530px){.head{align-items:start;flex-direction:column}.search-button{min-width:32px;width:32px;font-size:0;padding:6px}.search-button kbd,.mode{display:none}.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{min-height:80px;padding:11px}.metric strong{font-size:21px}}
    .row-link{border:0;background:none;text-align:left;color:var(--blue);font-weight:650;padding:0;cursor:pointer}.stack{display:grid;gap:10px}.inline{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.selected-row{background:#f3f6fb}.btn:disabled{opacity:.45;cursor:not-allowed}.explain{font-size:10px;color:#7c6260;margin-top:6px}.banner{padding:9px 12px;border:1px solid #d7e1e6;background:#f8fbfd;border-radius:5px;font-size:11px;margin-bottom:14px}.data-row{padding:9px 0;border-bottom:1px solid #e7eded;font-size:11px}.data-row:last-child{border-bottom:0}.data-row small{color:var(--muted)}.data-row strong{display:block}.role-select{border:1px solid var(--line);background:white;border-radius:5px;padding:6px;font-size:11px}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.subnav .btn.active{border-color:var(--blue);color:var(--blue);background:#f2f5fc}.message{padding:9px 11px;border:1px solid var(--line);border-radius:5px;margin:8px 0;font-size:11px}.message small{display:block;color:var(--muted)}.message.human{border-left:3px solid #486bab}.message.buyer{border-left:3px solid #83949b}.guide{font-size:10px;color:var(--muted);margin-top:7px}.audit{max-height:210px;overflow:auto}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="卖家系统导航">
    <div class="brand"><span class="brand-icon">◫</span><div><strong>工业品售前平台</strong><small>SELLER WORKSPACE · WIREFRAME</small></div></div>
    <div class="tenant">◧ &nbsp; 示例企业空间 <span style="float:right">⌄</span></div>
    <div class="nav-scroll">
      <div class="nav-heading">日常工作</div>
      <button class="nav" data-page="home"><span class="symbol">⌑</span>工作台</button>
      <button class="nav" data-page="inquiries"><span class="symbol">▤</span>询盘与线索</button>
      <button class="nav" data-page="engineering"><span class="symbol">◇</span>工程任务</button>
      <button class="nav" data-page="rfqs"><span class="symbol">▦</span>RFQ 与跟进</button>
      <div class="nav-heading">产品知识</div>
      <button class="nav" data-page="products"><span class="symbol">▧</span>产品资料</button>
      <button class="nav" data-page="review"><span class="symbol">◩</span>资料核准</button>
      <button class="nav" data-page="publication"><span class="symbol">▣</span>页面发布</button>
      <button class="nav" data-page="templates"><span class="symbol">▥</span>企业模板<span class="v1">V1</span></button>
      <div class="nav-heading">组织管理</div>
      <button class="nav" data-page="team"><span class="symbol">◎</span>成员与权限</button>
      <button class="nav" data-page="analytics"><span class="symbol">▤</span>流程分析<span class="v1">V1</span></button>
    </div>
    <div class="side-foot"><strong id="roleLabel">示例管理员</strong>交互线稿；所有数据和状态仅供演示，不连接真实买家或业务服务。</div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-left"><button class="menu" id="menu" aria-label="打开导航">☰</button><span class="crumb" id="crumb"></span></div>
      <div class="topbar-right"><button class="search-button" id="search">⌕ &nbsp; 查找页面或对象 <kbd>⌘ K</kbd></button><label class="note" for="role">演示岗位</label><select class="role-select" id="role"><option value="admin">管理员</option><option value="product">产品负责人</option><option value="sales">销售</option><option value="engineer">售前工程师</option></select><span class="mode">卖家系统线稿</span></div>
    </header>
    <main id="main"></main>
  </div>
</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="快捷查找"><div class="command"><input id="commandInput" placeholder="输入页面名或 P-001、C-042、T-204、RFQ-1087"><div class="command-list" id="commandList"></div><div class="command-foot">⌘ K 打开 · Esc 关闭 · 仅查找本线稿示例对象</div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  var labels={home:'工作台',inquiries:'询盘与线索',engineering:'工程任务',rfqs:'RFQ 与跟进',products:'产品资料',review:'资料核准',publication:'页面发布',templates:'企业模板 · V1',team:'成员与权限',analytics:'流程分析 · V1'};
  var app={
    role:'admin', page:'home', id:null, timer:null,
    products:[
      {id:'P-001',name:'Lowara 3SV08NL007T',version:2,pageVersion:1,published:true,previewed:false,approved:[{key:'型号',value:'3SV08NL007T',source:'型号资料 · 第 2 页'},{key:'额定功率',value:'0.75 kW',source:'技术手册 Rev. B · 第 8 页'}],draft:[{key:'材料',value:'配置待核对',source:'系列资料 · 第 12 页'}],gaps:['本型号性能曲线','介质适用性']},
      {id:'P-002',name:'示例型号 B',version:1,pageVersion:0,published:false,previewed:false,approved:[{key:'型号',value:'型号 B',source:'示例资料 · 第 1 页'}],draft:[{key:'额定功率',value:'1.1 kW（演示值）',source:'示例资料 · 第 4 页'}],gaps:['材料证明','性能曲线']}
    ],
    conversations:[
      {id:'C-042',title:'楼宇供水增压',source:'网页对话',owner:null,consent:false,stop:false,confirmed:true,need:'楼宇供水增压',unknown:'流量、扬程、介质',recommendation:'P-001 v01 · 待核实候选',messages:[{who:'买家',body:'需要用于楼宇供水增压，想确认型号是否适合实际工况。'},{who:'AI 助手',body:'已确认用途为楼宇供水增压；流量、扬程与介质仍需核实。当前仅为待核实候选，不构成适用性结论。'}]},
      {id:'C-058',title:'工况待补充',source:'网页对话',owner:null,consent:false,stop:false,confirmed:false,need:'生产线供水（待买家确认）',unknown:'流量、扬程、介质',recommendation:null,messages:[{who:'买家',body:'想了解生产线供水用泵。'}]},
      {id:'C-063',title:'已知型号咨询',source:'产品页',owner:null,consent:false,stop:false,confirmed:false,need:'已知型号 P-001',unknown:'实际工况',recommendation:null,messages:[{who:'买家',body:'这个型号额定功率是多少？'},{who:'AI 助手',body:'核准资料中的额定功率为 0.75 kW。出处：技术手册 Rev. B，第 8 页；产品版本 v02。'}]},
      {id:'C-070',title:'未选型询价',source:'网页对话',owner:null,consent:false,stop:false,confirmed:false,need:'采购泵，尚未选型',unknown:'型号、工况',recommendation:null,messages:[{who:'买家',body:'请给我报价，我还没有选定型号。'}]}
    ],
    task:{id:'T-204',conversation:'C-042',product:'P-001',status:'待工程师处理',question:'型号 3SV08NL007T 是否适合我这栋楼的实际供水增压工况？',draft:'',asked:false,answer:null},
    rfqs:[
      {id:'RFQ-1087',conversation:'C-042',model:'P-001',status:'待领取',gap:'流量、扬程、介质待补',time:'10:00',intent:'楼宇增压采购 A',revisions:[{text:'初次提交：型号 P-001，工况待补',time:'10:00'},{text:'修订 #1：补充交付地点',time:'10:20'}]},
      {id:'RFQ-1088',conversation:'C-042',model:'P-002',status:'待核实',gap:'材料与性能曲线待核',time:'10:30',intent:'独立采购请求 B',revisions:[{text:'初次提交：独立询价型号 P-002',time:'10:30'}]},
      {id:'RFQ-1090',conversation:'C-042',model:'P-001',status:'待核实',gap:'数量待补',time:'10:45',intent:'独立采购请求 C',revisions:[{text:'初次提交：再次询价型号 P-001，独立采购意图',time:'10:45'}]},
      {id:'RFQ-1089',conversation:'C-070',model:null,status:'待核实',gap:'型号、工况待补',time:'11:10',intent:'待选型询价',revisions:[{text:'初次提交：未选型号，买家确认联系方式',time:'11:10'}]}
    ],
    audit:[]
  };
  function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function find(list,id){return list.find(function(x){return x.id===id})}
  function current(list){return find(list,app.id)||list[0]}
  function can(action){return app.role==='admin'||({approve:['product'],publish:['product'],engineer:['engineer'],sales:['sales']}[action]||[]).includes(app.role)}
  function act(label,action,klass,ok,reason){return '<button class="btn '+(klass||'')+'" data-action="'+action+'"'+(ok?'':' disabled title="'+esc(reason||'当前岗位无权执行')+'"')+'>'+esc(label)+'</button>'}
  function go(label,page,id,klass){return '<button class="'+(klass||'link')+'" data-page="'+page+'"'+(id?' data-id="'+esc(id)+'"':'')+'>'+esc(label)+'</button>'}
  function badge(s){var c=/已发布|已答复|已确认/.test(s)?'green':/待|缺|未/.test(s)?'amber':'blue';return '<span class="badge '+c+'">'+esc(s)+'</span>'}
  function panel(title,body,extra){return '<section class="panel"><div class="panel-head"><h2>'+title+'</h2>'+(extra||'')+'</div><div class="panel-body">'+body+'</div></section>'}
  function heading(n,title,subtitle,buttons){return '<div class="head"><div><span class="kicker">'+n+'</span><h1>'+title+'</h1><p class="subtitle">'+subtitle+'</p></div><div class="actions">'+(buttons||'')+'</div></div>'}

  function action(name){
    var p=current(app.products),r=current(app.rfqs),c=find(app.conversations,r.conversation),t=app.task;
    if(name==='add-product'&&can('approve')){var id='P-'+String(app.products.length+1).padStart(3,'0');app.products.push({id:id,name:'新导入示例产品',version:1,pageVersion:0,published:false,previewed:false,approved:[],draft:[{key:'型号',value:'示例型号 C（演示）',source:'新上传示例文件 · 第 1 页'}],gaps:['技术参数','曲线']});audit('产品导入',id+' 抽取草稿待核');navigate('review',id);return}
    if(name==='approve'&&can('approve')&&p.draft.length&&p.draft.every(function(f){return !/待核对|待人工核准/.test(f.value)})){p.approved=p.approved.concat(p.draft);p.draft=[];p.version++;p.previewed=false;audit('事实核准',p.id+' 事实版本 v'+p.version);toast('已核准草稿事实；发布前须重新核对内容')}
    else if(name==='preview'&&can('publish')){p.previewed=true;audit('内容核对',p.id+' · 事实、出处与缺项');toast('已记录内容核对')}
    else if(name==='publish'&&can('publish')&&p.previewed&&p.approved.length){p.pageVersion++;p.published=true;p.previewed=false;audit('页面发布',p.id+' 页面 v'+p.pageVersion);toast('已发布演示页面版本 v'+p.pageVersion)}
    else if(name==='confirm-requirement'){var q=current(app.conversations);q.confirmed=true;q.recommendation='条件不足：需进一步核对流量、扬程、介质';q.messages.push({who:'系统事件',body:'买家确认了需求摘要；因关键参数缺失，尚无可靠推荐。'});audit('需求确认',q.id+' 仍有未知项');toast('需求已确认；当前条件不足，未推荐产品')}
    else if(name==='task-ask'&&can('engineer')&&t.draft.trim()){t.status='待买家补充';find(app.conversations,t.conversation).messages.push({who:'售前工程师',body:t.draft.trim()});audit('人工追问',t.id+' → 原会话');t.draft='';toast('追问已回到原会话')}
    else if(name==='task-buyer-reply'&&t.status==='待买家补充'){t.status='待工程师处理';find(app.conversations,t.conversation).messages.push({who:'买家',body:'补充：正在确认楼宇实际流量和扬程，稍后提供。'});audit('买家补充',t.id+' 保留原任务');toast('买家补充已记录；原任务继续处理')}
    else if(name==='task-answer'&&can('engineer')&&t.draft.trim()){t.status='已答复';t.answer=t.draft.trim();find(app.conversations,t.conversation).messages.push({who:'售前工程师',body:t.answer});audit('工程答复',t.id+' → 原会话');t.draft='';toast('人工答复已显示在原会话')}
    else if(name==='claim'&&can('sales')&&!c.owner){c.owner='示例销售';audit('线索领取',c.id+' · 一个会话一个负责人');toast('已领取会话线索')}
    else if(name==='rfq-complete'&&can('sales')){r.status='已处理';audit('RFQ 状态',r.id+' → 已处理');toast(r.id+' 已标记处理')}
    else if(name==='toggle-contact'&&can('sales')){c.stop=!c.stop;audit('主动联系',c.id+(c.stop?' · 已停止':' · 已恢复'));toast('主动联系状态已更新；RFQ 状态未变')}
    else if(name==='add-model'&&can('sales')&&!r.model){r.model='P-001';r.gap='流量、扬程待补';r.revisions.push({text:'原采购请求补充型号 P-001；编号不变',time:'现在'});audit('买家 RFQ 修订模拟',r.id+' 补充型号');toast('已在原 RFQ 补充型号')}
    else if(name==='correct-model'&&can('sales')&&r.model){var old=r.model;r.model=old==='P-001'?'P-002':'P-001';r.revisions.push({text:'原采购请求纠正误选型号：'+old+' → '+r.model+'；编号不变',time:'现在'});audit('买家 RFQ 修订模拟',r.id+' 更正型号');toast('已更正型号，RFQ 编号不变')}
    else if(name==='new-rfq'&&can('sales')){var id='RFQ-'+(1100+app.rfqs.length);app.rfqs.push({id:id,conversation:r.conversation,model:r.model,status:'待核实',gap:'采购条件待确认',time:'10:50',intent:'买家另起的独立采购请求（演示）',revisions:[{text:'独立采购请求初次提交，联系方式已确认',time:'现在'}]});audit('新 RFQ',id+' · 同一会话 '+r.conversation);navigate('rfqs',id);toast('已建立独立 RFQ；原编号仍保留');return}
    render();
  }
  document.addEventListener('click',function(e){var b=e.target.closest('[data-page]');if(b){navigate(b.dataset.page,b.dataset.id);return}var a=e.target.closest('[data-action]');if(a&&!a.disabled){action(a.dataset.action);return}if(e.target===document.getElementById('overlay'))document.getElementById('overlay').classList.remove('open')});
  document.addEventListener('input',function(e){if(e.target.id==='answer'){app.task.draft=e.target.value;document.querySelectorAll('[data-action="task-ask"],[data-action="task-answer"]').forEach(function(x){x.disabled=!can('engineer')||!app.task.draft.trim()||app.task.status==='已答复'})}});
  document.getElementById('role').addEventListener('change',function(){app.role=this.value;render()});
  document.getElementById('menu').addEventListener('click',function(){document.getElementById('sidebar').classList.toggle('open')});
  var overlay=document.getElementById('overlay'),input=document.getElementById('commandInput'),list=document.getElementById('commandList');
  function commands(q){var items=Object.keys(labels).map(function(k){return {label:labels[k],page:k}}).concat(app.products.map(function(x){return {label:x.id+' · '+x.name,page:'review',id:x.id}}),app.conversations.map(function(x){return {label:x.id+' · '+x.title,page:'inquiries',id:x.id}}),[{label:'T-204 · 工程任务',page:'engineering',id:'T-204'}],app.rfqs.map(function(x){return {label:x.id+' · '+x.intent,page:'rfqs',id:x.id}}));list.innerHTML=items.filter(function(x){return !q||x.label.toLowerCase().includes(q.toLowerCase())}).map(function(x){return '<button data-page="'+x.page+'"'+(x.id?' data-id="'+x.id+'"':'')+'>'+esc(x.label)+'</button>'}).join('')||'<div class="note" style="padding:12px">没有匹配对象</div>'}
  function open(){input.value='';commands('');overlay.classList.add('open');input.focus()}
  document.getElementById('search').addEventListener('click',open);input.addEventListener('input',function(){commands(this.value)});
  document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();open()}if(e.key==='Escape'){overlay.classList.remove('open');document.getElementById('sidebar').classList.remove('open')}});
  window.addEventListener('hashchange',function(){var a=location.hash.slice(1).split('/');navigate(a[0],a[1],false)});
  var start=location.hash.slice(1).split('/');navigate(start[0]||'home',start[1],false);
}());
</script>
</body>
</html>
