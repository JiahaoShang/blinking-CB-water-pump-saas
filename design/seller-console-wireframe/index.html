        details('查看判断依据与缺失条件',row('已确认',esc(c.need))+row('未确认',esc(c.unknown))+row('为何转人工','现有资料不足以判断该工况适用性')+row('资料版本',go('P-001 v02 · 已核准事实','review','P-001'))))+
      panel('关联记录',item('原会话 '+c.id,'追问与答复在这里送达',go('查看','inquiries',c.id))+
        item('产品 P-001','检查已核准事实与出处',go('查看','review','P-001'))+
        details('查看关联询价单',app.rfqs.filter(function(r){return r.conversation===c.id}).map(function(r){return item(r.id,esc(r.status),go('查看','rfqs',r.id))}).join(''))+
        '<p class="fineprint">人工答复不自动成为产品通用知识；复用前须经过资料核准。</p>')+'</div>';
  }
  function hint(r){function minutes(t){var a=t.split(':');return Number(a[0])*60+Number(a[1])}return app.rfqs.filter(function(x){return x.id!==r.id&&x.conversation===r.conversation&&x.model&&x.model===r.model&&Math.abs(minutes(x.time)-minutes(r.time))<=1440}).map(function(x){return x.id})}
  function rfqs(){
    var r=current(app.rfqs),c=find(app.conversations,r.conversation),h=hint(r);
    var primary=!c.owner?
      focus('当前任务 · '+esc(r.id),'认领这条客户咨询','同一段咨询由一位销售负责，关联的询价单仍各自处理。',act('认领咨询','claim','primary',can('sales'),'需要销售权限')):
      r.status==='已处理'?
      focus('当前状态 · '+esc(r.id),'这份询价单已处理','其他询价单的状态不会因此改变。',go('查看原会话','inquiries',c.id,'btn')):
      focus('当前任务 · '+esc(r.id),'处理这份采购请求','核对待补项并记录处理结果；负责人为 '+esc(c.owner)+'。',act('标记此询价单已处理','rfq-complete','primary',can('sales'),'需要销售权限'));
    return heading('客户跟进','询价单','先选买家的询价，再处理当前事项；历史修改可按需展开。',go('查看客户咨询','inquiries',c.id,'btn'))+
      '<div class="workspace-grid"><div><h2 class="section-title">选择询价单</h2>'+
      switcher(app.rfqs,'rfqs',r.id,function(x){return esc(x.id+' · '+(x.model||'未选型号'))},function(x){return esc(x.status+' · '+x.intent)})+
      '</div><div>'+primary+
      panel('当前询价',row('采购请求',esc(r.intent))+row('型号',esc(r.model||'未选定'))+
        '<div class="summary-strip"><span>状态：'+esc(r.status)+'</span><span>待补：'+esc(r.gap)+'</span><span>负责人：'+esc(c.owner||'共享队列')+'</span></div>'+
        '<div class="actions">'+go('打开原会话 '+c.id,'inquiries',c.id,'btn')+'</div>'+
        details('查看联系方式与主动联系状态',row('联系方式',can('sales')?'演示：已确认一种可回复方式（无真实值）':'无权查看')+
          row('主动联系',c.stop?'已停止':'按买家授权与业务状态')+
          act(c.stop?'恢复主动联系':'停止主动联系','toggle-contact','',can('sales'),'需要销售权限')+
          '<p class="guide">停止主动联系与询价单处理状态分别记录。</p>'))+
      panel('补充与历史',h.length?'<div class="callout">同会话、24 小时内有同型号询价可能相关：'+h.map(function(id){return go(id,'rfqs',id)}).join(' · ')+'。请人工核对采购意图。</div>':
        '<div class="muted-block">当前没有同会话、24 小时内的同型号提示。</div>'+
        details('查看初次提交与修订 · '+r.revisions.length+' 条',r.revisions.map(function(v,i){return row('修订 '+i+' · '+v.time,esc(v.text))}).join(''))+
        details('演示询价单编号与更正规则','<p class="note">以下按钮仅模拟买家已提出并确认的行为，不是销售擅自修改买家询价。</p><div class="actions">'+
          act('模拟原请求补充型号','add-model','',can('sales')&&!r.model,'仅未选型号 RFQ 可补充')+
          act('模拟原请求纠正型号','correct-model','',can('sales')&&!!r.model,'需要销售权限且已有型号')+
          act('模拟新采购请求','new-rfq','',can('sales'),'需要销售权限')+'</div><p class="guide">补充或纠错沿用原编号；独立请求新建编号。相似提示不自动合并，也不跨会话匹配。</p>'))+
      '</div></div>';
  }
  function team(){
    return heading('团队','团队成员','演示岗位可从右上角切换；这里只呈现与日常工作有关的权限。')+
      panel('岗位与可处理事项','<div class="simple-list">'+
        item('产品负责人','核准产品事实、核对并发布页面','')+
        item('工程师','处理买家明确提交的人工问题','')+
        item('销售','认领客户咨询、处理各份询价单','')+
        item('管理员','查看和操作本示例企业的演示功能','')+'</div>'+
        details('查看演示操作记录',app.audit.length?app.audit.map(function(a){return row(a.time+' · '+a.type,esc(a.details))}).join(''):'<div class="muted-block">尚无操作记录。</div>')+
        '<div class="callout gap">这里的岗位切换只是线稿模拟。正式产品仍需服务端权限校验、企业隔离和审计。</div>');
  }
  function v1(title,desc){return heading('后续规划',title+' '+badge('规划中'),desc)+
    '<div class="empty"><strong>未来会从现有业务页面进入</strong><p>'+(title==='产品介绍模板'?'产品资料核对 → 模板草稿 → 预览 → 负责人确认 → 发布产品介绍。完整自定义能力将在后续版本提供。':'客户咨询、推荐、技术答复和询价单的真实记录 → 业务效果分析。这里不展示未经测量的成交效果。')+'</p></div>'}
  function render(){
    document.getElementById('role').value=app.role;
    document.getElementById('roleLabel').textContent=({admin:'示例管理员',product:'产品负责人',sales:'示例销售',engineer:'售前工程师'})[app.role];
    document.getElementById('crumb').innerHTML=esc(navGroups[app.page])+' / <b>'+esc(labels[app.page])+'</b>'+(app.id?' / '+esc(app.id):'');
    document.title=labels[app.page]+'｜卖家系统线稿';
    document.getElementById('main').innerHTML=({home:home,inquiries:inquiries,engineering:engineering,rfqs:rfqs,products:products,review:review,publication:publication,team:team,templates:function(){return v1('产品介绍模板','以后可在产品经营中自定义介绍方式并审批。')},analytics:function(){return v1('业务效果','以后从已记录的咨询、答复和询价中分析处理效果。')}}[app.page])();
  }
  function action(name){
    var p=current(app.products),r=current(app.rfqs),c=find(app.conversations,r.conversation),t=app.task;
    if(name==='add-product'&&can('approve')){var id='P-'+String(app.products.length+1).padStart(3,'0');app.products.push({id:id,name:'新导入示例产品',version:1,pageVersion:0,publishedFactVersion:0,published:false,previewed:false,approved:[],draft:[{key:'型号',value:'示例型号 C（演示）',source:'新上传示例文件 · 第 1 页'}],gaps:['技术参数','曲线']});audit('产品导入',id+' 抽取草稿待核');navigate('review',id);return}
    if(name==='approve'&&can('approve')&&p.draft.length&&p.draft.every(function(f){return !/待核对|待人工核准/.test(f.value)})){p.approved=p.approved.concat(p.draft);p.draft=[];p.version++;p.previewed=false;audit('事实核准',p.id+' 事实版本 v'+p.version);toast('已核准草稿事实；发布前须重新核对内容')}
    else if(name==='preview'&&can('publish')&&p.version!==p.publishedFactVersion){p.previewed=true;audit('内容核对',p.id+' · 事实、出处与缺项');toast('已记录内容核对')}
    else if(name==='publish'&&can('publish')&&p.previewed&&p.approved.length&&p.version!==p.publishedFactVersion){p.pageVersion++;p.publishedFactVersion=p.version;p.published=true;p.previewed=false;audit('页面发布',p.id+' 页面 v'+p.pageVersion);toast('已发布演示页面版本 v'+p.pageVersion)}
    else if(name==='confirm-requirement'){var q=current(app.conversations);q.confirmed=true;q.recommendation='条件不足：需进一步核对流量、扬程、介质';q.messages.push({who:'系统事件',body:'买家确认了需求摘要；因关键参数缺失，尚无可靠推荐。'});audit('需求确认',q.id+' 仍有未知项');toast('需求已确认；当前条件不足，未推荐产品')}
    else if(name==='task-ask'&&can('engineer')&&t.draft.trim()){t.status='待买家补充';find(app.conversations,t.conversation).messages.push({who:'售前工程师',body:t.draft.trim()});audit('人工追问',t.id+' → 原会话');t.draft='';toast('追问已回到原会话')}
    else if(name==='task-buyer-reply'&&t.status==='待买家补充'){t.status='待工程师处理';find(app.conversations,t.conversation).messages.push({who:'买家',body:'补充：正在确认楼宇实际流量和扬程，稍后提供。'});audit('买家补充',t.id+' 保留原任务');toast('买家补充已记录；原任务继续处理')}
    else if(name==='task-answer'&&can('engineer')&&t.draft.trim()){t.status='已答复';t.answer=t.draft.trim();find(app.conversations,t.conversation).messages.push({who:'售前工程师',body:t.answer});audit('工程答复',t.id+' → 原会话');t.draft='';toast('人工答复已显示在原会话')}
    else if(name==='claim'&&can('sales')&&!c.owner){c.owner='示例销售';r.status='处理中';audit('认领咨询',c.id+' · 一个会话一个负责人；'+r.id+' → 处理中');toast('已认领咨询；当前询价单进入处理中')}
    else if(name==='rfq-complete'&&can('sales')){r.status='已处理';audit('RFQ 状态',r.id+' → 已处理');toast(r.id+' 已标记处理')}
    else if(name==='toggle-contact'&&can('sales')){c.stop=!c.stop;audit('主动联系',c.id+(c.stop?' · 已停止':' · 已恢复'));toast('主动联系状态已更新；RFQ 状态未变')}
    else if(name==='add-model'&&can('sales')&&!r.model){r.model='P-001';r.gap='流量、扬程待补';r.revisions.push({text:'原采购请求补充型号 P-001；编号不变',time:'现在'});audit('买家 RFQ 修订模拟',r.id+' 补充型号');toast('已在原 RFQ 补充型号')}
    else if(name==='correct-model'&&can('sales')&&r.model){var old=r.model;r.model=old==='P-001'?'P-002':'P-001';r.revisions.push({text:'原采购请求纠正误选型号：'+old+' → '+r.model+'；编号不变',time:'现在'});audit('买家 RFQ 修订模拟',r.id+' 更正型号');toast('已更正型号，RFQ 编号不变')}
    else if(name==='new-rfq'&&can('sales')){var id='RFQ-'+(1100+app.rfqs.length);app.rfqs.push({id:id,conversation:r.conversation,model:r.model,status:'待核实',gap:'采购条件待确认',time:'10:50',intent:'买家另起的独立采购请求（演示）',revisions:[{text:'独立采购请求初次提交，联系方式已确认',time:'现在'}]});audit('新 RFQ',id+' · 同一会话 '+r.conversation);navigate('rfqs',id);toast('已建立独立 RFQ；原编号仍保留');return}
    render();
  }
  document.addEventListener('click',function(e){var b=e.target.closest('[data-page]');if(b){navigate(b.dataset.page,b.dataset.id);return}var a=e.target.closest('[data-action]');if(a&&!a.disabled){action(a.dataset.action);return}if(e.target===document.getElementById('overlay'))document.getElementById('overlay').classList.remove('open')});
  document.addEventListener('input',function(e){if(e.target.id==='answer'){app.task.draft=e.target.value;document.querySelectorAll('[data-action="task-ask"],[data-action="task-answer"]').forEach(function(x){x.disabled=!can('engineer')||!app.task.draft.trim()||app.task.status==='已答复'})}});
  document.getElementById('role').addEventListener('change',function(){app.role=this.value;render()});
  document.getElementById('menu').addEventListener('click',function(){document.getElementById('sidebar').classList.toggle('open')});
  var overlay=document.getElementById('overlay'),input=document.getElementById('commandInput'),list=document.getElementById('commandList');
  function commands(q){var items=Object.keys(labels).map(function(k){return {label:labels[k],page:k}}).concat(app.products.map(function(x){return {label:x.id+' · '+x.name,page:'review',id:x.id}}),app.conversations.map(function(x){return {label:x.id+' · '+x.title,page:'inquiries',id:x.id}}),[{label:'T-204 · 待答技术问题',page:'engineering',id:'T-204'}],app.rfqs.map(function(x){return {label:x.id+' · '+x.intent,page:'rfqs',id:x.id}}));list.innerHTML=items.filter(function(x){return !q||x.label.toLowerCase().includes(q.toLowerCase())}).map(function(x){return '<button data-page="'+x.page+'"'+(x.id?' data-id="'+x.id+'"':'')+'>'+esc(x.label)+'</button>'}).join('')||'<div class="note" style="padding:12px">没有匹配对象</div>'}
  function open(){input.value='';commands('');overlay.classList.add('open');input.focus()}
  document.getElementById('search').addEventListener('click',open);input.addEventListener('input',function(){commands(this.value)});
  document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();open()}if(e.key==='Escape'){overlay.classList.remove('open');document.getElementById('sidebar').classList.remove('open')}});
  window.addEventListener('hashchange',function(){var a=location.hash.slice(1).split('/');navigate(a[0],a[1],false)});
  var start=location.hash.slice(1).split('/');navigate(start[0]||'home',start[1],false);
}());
</script>
</body>
</html>
