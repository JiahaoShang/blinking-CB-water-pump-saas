<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MVP 核心旅程｜可点击交互线稿</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#e8e9ed;background:#111316}
    *{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #e8bb37;outline-offset:2px}
    button{border:1px solid #3b3e45;background:#26292e;color:#f2f2f4;border-radius:8px;padding:9px 13px}button:hover{background:#32363d}button.primary{background:#dfb92f;border-color:#dfb92f;color:#111316;font-weight:700}button.primary:hover{background:#f1cb43}button.ghost{background:transparent}button:disabled{opacity:.5;cursor:not-allowed}
    .top{height:64px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 22px;background:#17191d;border-bottom:1px solid #34363c}.brand{font-weight:700;letter-spacing:-.02em}.brand small{font-weight:400;color:#989da5;margin-left:10px}.switch{display:flex;gap:6px}.switch button.active{border-color:#c6a52b;color:#f2d35e}.status{font-size:12px;color:#a3a8b0}
    .notice{padding:10px 22px;background:#22252a;color:#c4c8cf;font-size:12px;border-bottom:1px solid #34363c}.notice a{color:#f0ca4e}.layout{display:grid;grid-template-columns:225px minmax(0,1fr);min-height:calc(100vh - 101px)}.side{border-right:1px solid #34363c;background:#17191d;padding:20px 13px}.side h2{font-size:12px;color:#9299a1;font-weight:600;margin:5px 10px 16px}.side button{width:100%;display:block;text-align:left;background:transparent;border:0;margin:3px 0}.side button.active{background:#2d3036;color:#f3d353}.side small{display:block;color:#899099;font-size:11px;margin:12px 10px}.main{padding:32px;max-width:1300px;width:100%;margin:0 auto}.eyebrow{font-size:11px;color:#ebc747;letter-spacing:.1em;text-transform:uppercase}.main h1{font-size:28px;margin:7px 0 8px}.lead{color:#aeb4bc;font-size:14px;line-height:1.65;margin:0 0 25px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{border:1px solid #373b42;background:#1d2025;border-radius:12px;padding:18px;margin-bottom:16px}.card h2{font-size:16px;margin:0 0 13px}.card h3{font-size:14px;margin:0 0 9px}.card p,.card li{color:#b6bcc4;font-size:13px;line-height:1.6}.card p:last-child{margin-bottom:0}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid #353941}.row:first-of-type{border-top:0}.row span{color:#aeb4bc;font-size:13px}.row strong{font-size:13px;text-align:right}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.pill{display:inline-block;padding:4px 8px;border:1px solid #62604b;border-radius:6px;color:#eacb66;font-size:11px}.pill.dim{border-color:#4b5059;color:#b1b6c0}.field{display:block;width:100%;border:1px solid #4b5059;background:#14171b;color:#f3f3f4;border-radius:8px;padding:10px 12px;margin:7px 0 12px}.field::placeholder{color:#7f8790}label{font-size:12px;color:#bfc4cb}.error{border:1px solid #a76464;background:#382629;border-radius:8px;padding:10px 12px;color:#ffd8d8;font-size:12px;margin:10px 0}.success{border:1px solid #5a8063;background:#22342a;border-radius:8px;padding:10px 12px;color:#c9edd0;font-size:12px;margin:10px 0}.hint{color:#9ca3ad;font-size:12px;line-height:1.55}.trace{padding:11px 0;border-top:1px solid #353941;font-size:12px;color:#c4c8ce}.trace strong{color:#f0f1f3}.checks{display:grid;gap:8px}.checks label{display:flex;align-items:center;gap:8px}.checks input{accent-color:#ddb934}.demo-select{color:#c8ccd2;font-size:12px}.demo-select select{border:1px solid #4b5059;background:#22252a;color:#f1f1f1;border-radius:6px;padding:5px}
    .buyer-site{min-height:calc(100vh - 101px);background:#f3f5f6;color:#243039}.buyer-nav{background:white;border-bottom:1px solid #d9e0e3;padding:18px 5vw;display:flex;justify-content:space-between;align-items:center}.buyer-nav strong{font-size:17px}.buyer-nav button,.buyer-hero button{background:#1f526c;color:white;border-color:#1f526c}.buyer-hero{max-width:800px;margin:9vh auto;padding:0 24px}.buyer-hero h1{font-size:42px;line-height:1.16;margin:0 0 20px}.buyer-hero p{color:#5f6d76;line-height:1.7}.buyer-hero .mock{background:white;border:1px solid #dce2e4;border-radius:12px;padding:22px;margin-top:30px;color:#55636b}.buyer-hero .mock strong{display:block;color:#22323b;margin-bottom:9px}.buyer-hero .mock p{margin:0}
    .chat{position:fixed;right:20px;bottom:18px;width:430px;height:690px;max-height:calc(100vh - 100px);resize:both;overflow:hidden;display:flex;flex-direction:column;border:1px solid #ced7da;border-radius:15px;background:#fff;box-shadow:0 24px 70px #22313a35;color:#243039;z-index:3}.chat-head{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#f9fbfb;border-bottom:1px solid #dce3e6;padding:11px 14px}.chat-head strong{font-size:13px}.chat-head small{display:block;color:#76848b;font-size:10px}.chat-head button,.chat-foot button,.chat-body button{background:#fff;color:#26465a;border-color:#cbd8dd}.chat-body button.primary,.chat-foot button.primary{background:#1f526c;border-color:#1f526c;color:white}.chat-body{overflow:auto;flex:1;padding:14px}.bubble{border:1px solid #dce4e7;background:#f7fafb;border-radius:12px;padding:11px 12px;margin-bottom:11px;font-size:12px;line-height:1.5}.bubble.buyer{margin-left:48px;background:#eaf3f8;border-color:#d3e6ee}.bubble strong{display:block;font-size:11px;margin-bottom:5px;color:#426174}.bubble p{margin:4px 0}.chat-card{border:1px solid #cad8de;border-radius:11px;background:#fff;padding:12px;margin:11px 0;font-size:12px}.chat-card h3{font-size:13px;margin:0 0 7px}.chat-card p{font-size:12px;line-height:1.45;color:#54636b}.chat-card .field{background:white;color:#243039;border-color:#cbd8dd;padding:8px;margin:5px 0 9px}.chat-card label{color:#4d606b}.chat-card .actions{margin-top:9px}.chat-card a{display:block;color:#1b587a;margin:7px 0}.chat-card .error{background:#fff1f1;color:#a03838}.chat-card .success{background:#eef8ef;color:#24623a}.chat-foot{padding:10px;border-top:1px solid #dce3e6;background:#f9fbfb}.chat-foot .quick{display:flex;gap:5px;overflow-x:auto;padding-bottom:7px}.chat-foot .quick button{font-size:10px;white-space:nowrap;padding:6px}.chat-foot .send{display:flex;gap:6px}.chat-foot input{flex:1;min-width:0;border:1px solid #cbd8dd;border-radius:8px;padding:10px}.chat-foot .send button{padding:8px 10px}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;gap:4px;padding:8px}.side h2,.side small{display:none}.side button{min-width:max-content;font-size:11px}.main{padding:22px}.grid{grid-template-columns:1fr}.top{height:auto;min-height:64px;flex-wrap:wrap;padding:10px 14px}.brand small{display:none}}
    @media(max-width:600px){.buyer-hero{margin:6vh auto}.buyer-hero h1{font-size:31px}.chat{width:calc(100vw - 18px);height:78vh;max-height:78vh;right:9px;bottom:9px;resize:none}.status{display:none}.chat-head button{min-height:36px}.buyer-nav{padding:12px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  (()=>{
    const state={mode:'seller',page:'products',published:false,source:false,reviewed:false,checked:false,chatOpen:false,chatDraft:'',messages:[],req:{use:'楼宇供水增压',flow:'3',head:'40',unknown:'介质待确认'},reqConfirmed:false,reqDirty:false,reqRevision:0,unknownAsked:false,humanForm:false,humanTask:null,humanDraft:'',rfqForm:false,rfqEdit:false,rfqDraft:{model:'示例泵 A',quantity:'',contact:'',notes:''},rfq:null,owner:null,stop:false,fail:'none',error:''};
    const $=s=>document.querySelector(s);
    const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const btn=(text,action,kind='')=>`<button type="button" class="${kind}" data-action="${action}">${text}</button>`;
    const err=()=>state.error?`<div class="error" role="alert">${e(state.error)}</div>`:'';
    const header=()=>`<header class="top"><div class="brand">工业品售前 · 核心旅程线稿 <small>卖家深色参考 / 买家官网聊天参考</small></div><div class="switch">${btn('卖家系统','mode-seller',state.mode==='seller'?'active':'')}${btn('买家官网','mode-buyer',state.mode==='buyer'?'active':'')}</div><div class="demo-select">模拟失败：<select id="fail"><option value="none">关闭</option><option value="publish">发布</option><option value="human">人工请求</option><option value="reply">人工答复</option><option value="rfq">RFQ 提交</option></select></div></header><div class="notice">这是可点击交互线稿，所有数据和故障均为模拟，不连接真实业务。先在卖家端发布产品，再切到买家官网完成咨询。<a href="../seller-console-wireframe/index.html" target="_blank" rel="noopener">查看原卖家概念线稿 ↗</a></div>`;
    const steps=[['products','产品目录','选择或导入型号'],['import','导入资料','模拟收到原文件'],['review','字段核对','人工确认出处'],['publish','内容预览与发布','核对有限信息'],['inquiries','客户咨询','原话、工况与关联'],['engineering','技术任务','人工追问与答复'],['rfqs','询价队列','领取与处理']];
    const seller=()=>`<div class="layout"><aside class="side"><h2>卖家工作区 · 演示企业</h2>${steps.map(([id,label,desc])=>`<button class="${state.page===id?'active':''}" data-page="${id}">${label}</button><small>${desc}</small>`).join('')}</aside><main class="main">${sellerPage()}</main></div>`;
    const title=(tag,name,desc)=>`<span class="eyebrow">${tag}</span><h1>${name}</h1><p class="lead">${desc}</p>${err()}`;
    const productRows=()=>`<div class="row"><span>示例泵 A · 楼宇增压</span><strong>${state.published?'<span class="pill">已发布 v1</span>':'<span class="pill dim">待发布</span>'}</strong></div><div class="row"><span>示例泵 B · 工业循环（独立演示资料）</span><strong><span class="pill">已发布演示页</span></strong></div><p class="hint">这两个型号及数值仅用于验证界面与匹配分层；不能作为工程选型依据。</p>`;
    function sellerPage(){
      if(state.page==='products')return title('S02 · 产品目录','选择产品','查看页面状态与资料缺口；发布状态与推荐资格分别判断。')+`<div class="card"><h2>产品</h2>${productRows()}<div class="actions">${btn('导入示例泵 A 的资料','page-import','primary')}${btn('查看待核对字段','page-review')}</div></div><div class="card"><h2>下一步</h2><p>导入 → 核对来源 → 内容预览 → 授权发布。现有卖家线稿仍保留 S00/S01/S06/S09 的细节。</p></div>`;
      if(state.page==='import')return title('S03 · 资料导入','导入产品资料','此线稿模拟文件接收；正式产品要显示真实上传、抽取与失败状态。')+`<div class="card"><h2>示例泵 A · 原文件</h2><div class="row"><span>产品技术手册 · 演示文件</span><strong>${state.source?'已收到，待人工核对':'尚未导入'}</strong></div><p class="hint">演示来源：已提供的水泵研究资料；此页不实际上传文件，也不生成工程事实。</p><div class="actions">${btn('模拟上传并识别资料','upload-demo','primary')}${btn('进入字段核对','page-review')}</div></div>`;
      if(state.page==='review')return title('S04 · 字段核对','核对技术事实与出处','只把经授权人员确认的资料用于公开页、推荐和问答。')+`<div class="grid"><div class="card"><h2>来源定位</h2><p>示例资料：产品技术手册 · 当前型号页面</p><p>这里应能打开原文件并定位字段位置。此线稿仅验证入口和核准动作。</p>${btn('查看来源说明','show-source')}</div><div class="card"><h2>待核对字段</h2><div class="row"><span>型号</span><strong>示例泵 A</strong></div><div class="row"><span>用途</span><strong>楼宇供水增压（演示）</strong></div><div class="row"><span>尚缺资料</span><strong>介质适用性、当前型号曲线</strong></div><p class="hint">缺项不得填充猜测值，仍可准备有限信息页。</p><div class="actions">${btn(state.reviewed?'已核准 · 查看发布':'核准可确认字段','approve','primary')}</div></div></div>`;
      if(state.page==='publish')return title('S05 · 发布检查','内容预览与发布','核对拟公开的事实、来源和缺项；不在这里预设买方详情页的最终版式。')+`<div class="card"><h2>示例泵 A · 有限信息版</h2><div class="row"><span>已核准</span><strong>${state.reviewed?'型号、演示用途':'无'}</strong></div><div class="row"><span>公开缺项</span><strong>介质适用性、当前型号曲线</strong></div><div class="row"><span>附件权限</span><strong>未开放 CAD 下载</strong></div><div class="actions">${btn('确认本次预览内容','check-preview')}${btn(state.published?'已发布':'发布页面','publish',state.checked?'primary':'')}</div><p class="hint">发布成功后显示固定链接；买方详情页首屏与内容组织留待专项设计。</p></div>${state.published?'<div class="success">页面 v1 已发布。买家可在聊天的候选卡打开独立产品页；旧会话不会被替换。</div>':''}`;
      if(state.page==='inquiries')return title('S06 · 客户咨询','查看同一会话上下文','自助咨询、人工请求和 RFQ 是不同记录，在同一会话中关联查看。')+`<div class="grid"><div class="card"><h2>买方原话与答复</h2>${state.messages.length?state.messages.filter(m=>['buyer','assistant','human'].includes(m.type)).map(m=>`<div class="trace"><strong>${m.type==='buyer'?'买家':m.type==='human'?'售前工程师':'产品助手'}</strong> · ${e(m.text)}</div>`).join(''):'<p>尚无咨询记录。仅浏览产品页不会自动产生销售待办。</p>'}</div><div class="card"><h2>结构化进展</h2><div class="row"><span>需求确认</span><strong>${state.reqConfirmed?'已确认 · 修订 '+state.reqRevision:'待买方确认'}</strong></div><div class="row"><span>推荐</span><strong>${state.reqDirty?'旧结果已失效':state.messages.some(m=>m.type==='recommendation')?'演示候选已展示':'暂无'}</strong></div><div class="row"><span>人工任务</span><strong>${state.humanTask?'T-001 · '+e(state.humanTask.status):'无'}</strong></div><div class="row"><span>询价单</span><strong>${state.rfq?e(state.rfq.id):'无'}</strong></div><div class="actions">${btn('查看技术任务','page-engineering')}${btn('查看询价','page-rfqs')}</div></div></div>`;
      if(state.page==='engineering')return title('S07 · 技术任务','人工追问与答复','只有买方提交请求后才出现任务；答复发布到原网页会话。')+(state.humanTask?`<div class="card"><h2>任务 T-001 · ${state.humanTask.status}</h2><p>买方原问题：这台泵能否用于当前介质温度？</p><p>缺口：现有核准资料没有该温度下适用性的结论。</p><p>回复路径：买方在原会话查看；无站外通知。</p><label for="human-answer">工程师答复或追问</label><textarea id="human-answer" class="field" rows="4" placeholder="由工程师自行判断并填写">${e(state.humanDraft)}</textarea><div class="actions">${btn('发布到原会话','publish-reply','primary')}</div></div>`:'<div class="card"><h2>暂无人工任务</h2><p>资料外问题只保存在会话内。买方点击并提交“请求工程师答复”后，这里才会出现任务。</p></div>');
      return title('S08 · 询价队列','处理 RFQ','同一采购请求保留原编号；买方修改后在这里查看初次内容和逐次变化。')+(state.rfq?`<div class="card"><h2>${e(state.rfq.id)} · ${e(state.rfq.status)}</h2><div class="row"><span>型号</span><strong>${e(state.rfq.model)}</strong></div><div class="row"><span>数量</span><strong>${e(state.rfq.quantity||'待补充')}</strong></div><div class="row"><span>联系方式</span><strong>${e(state.rfq.contact)}</strong></div><div class="row"><span>负责人</span><strong>${e(state.owner||'共享队列 · 待领取')}</strong></div><div class="row"><span>主动联系</span><strong>${state.stop?'已停止 · 仅回应新请求':'可按当前请求跟进'}</strong></div><h3>仅卖方可见的修订记录</h3>${state.rfq.revisions.map((x,i)=>`<div class="trace"><strong>${i===0?'初次提交':'修改 '+i}</strong> · ${e(x)}</div>`).join('')}<div class="actions">${btn('销售领取','claim-rfq','primary')}${btn(state.stop?'保留停止联系标记':'记录买方停止主动联系','stop-contact')}</div></div>`:'<div class="card"><h2>共享队列为空</h2><p>买方可以在聊天的任意阶段发起 RFQ；提交时需确认至少一种可回复的联系方式。</p></div>');
    }
    function compareDemo(values){
      const flow=Number(values.flow),head=Number(values.head),valid=values.flow.trim()&&values.head.trim()&&Number.isFinite(flow)&&Number.isFinite(head);
      const points=[[0,60],[1.2,59.1],[1.5,58.2],[1.8,57],[2.1,55.4],[2.4,53.4],[2.7,51],[3,48.1],[3.6,40.7],[4.4,27.5]];
      const segment=points.findIndex((p,i)=>i>0&&flow<=p[0]);
      const aHead=segment>0?points[segment-1][1]+(points[segment][1]-points[segment-1][1])*(flow-points[segment-1][0])/(points[segment][0]-points[segment-1][0]):60;
      return {a:!!valid&&flow>=0&&flow<=4.4&&head<=aHead,b:!!valid&&flow>=2&&flow<=10&&head>=20&&head<=55,valid:!!valid};
    }
    function message(x){
      if(x.type==='buyer'||x.type==='assistant'||x.type==='human')return `<div class="bubble ${x.type==='buyer'?'buyer':''}"><strong>${x.type==='buyer'?'买家':x.type==='human'?'售前工程师':'产品助手'}</strong><p>${e(x.text)}</p></div>`;
      if(x.type==='requirements')return `<div class="chat-card"><h3>需求摘要 · 请确认</h3><p>以下内容是演示识别结果，可修改或标记未知。确认前不显示匹配候选。</p><label>用途<input class="field" data-req="use" value="${e(state.req.use)}"></label><label>流量 m³/h<input class="field" data-req="flow" value="${e(state.req.flow)}"></label><label>扬程 m<input class="field" data-req="head" value="${e(state.req.head)}"></label><label>未知条件<input class="field" data-req="unknown" value="${e(state.req.unknown)}"></label><div class="actions">${btn(state.reqConfirmed&&!state.reqDirty?'已确认 · 修改后重新确认':'确认已知值与未知项','confirm-req','primary')}</div></div>`;
      if(x.type==='recommendation'){const stale=state.reqDirty||x.revision!==state.reqRevision,result=compareDemo(x.snapshot);return `<div class="chat-card"><h3>${stale?'旧候选已失效':result.a||result.b?'初步候选比较 · 演示规则':'没有可靠候选 · 演示规则'}</h3><p>示例泵 A：${result.a?'Rev. B 表格点通过演示初筛，介质仍待核实':'已知工况超出演示初筛条件或条件不足，不进入候选'}。</p><p>示例泵 B：${result.b?'合成范围有交集，但无型号曲线和介质证明，只能待核实':'已知工况与合成范围冲突或条件不足，不进入候选'}。</p><p>示例泵 C 仅有名称和品类，没有相关性技术依据，不进入匹配结果。以上不是正式工程选型结论。</p>${stale?'<p>需求已改变，请重新确认后查看新候选。</p>':`${result.a?'<a href="../product-detail-concept/index.html?model=a&from=recommendation" target="_blank" rel="noopener">独立打开示例泵 A 产品页 ↗</a>':''}${result.b?'<a href="../product-detail-concept/index.html?model=b&from=recommendation" target="_blank" rel="noopener">独立打开示例泵 B 产品页 ↗</a>':''}`}${!state.humanTask?btn('向工程师请求选型协助','open-human'):''}</div>`}
      if(x.type==='answer')return `<div class="chat-card"><h3>资料内回答 · 有出处</h3><p>演示资料中已核准的用途说明可在产品页查看。这个回答仅描述资料内容，不替代实际工况适用性判断。</p><details><summary>查看出处</summary><p>示例泵 A · 技术手册（演示）· 型号与用途段落 · 页面版本 v1</p></details></div>`;
      if(x.type==='unknown')return `<div class="chat-card"><h3>需要核实的技术问题</h3><p>介质温度会影响适用性；当前核准资料没有给出该条件下的结论。可以请工程师结合你的工况检查。</p>${state.humanTask?'<span>已提交请求 T-001</span>':btn('请求工程师答复','open-human','primary')}</div>`;
      if(x.type==='rfq')return `<div class="chat-card"><h3>${e(state.rfq.id)} · 当前询价</h3><p>型号：${e(state.rfq.model)}；数量：${e(state.rfq.quantity||'待补充')}；说明：${e(state.rfq.notes||'无')}。</p>${btn('打开并编辑原 RFQ','edit-rfq')}</div>`;
      return '';
    }
    function form(){
      if(state.humanForm)return `<div class="chat-card"><h3>请求工程师答复</h3><p>默认在此对话查看回复。请保留本浏览器的会话；系统不会向邮箱或社交平台主动通知。</p><div class="actions">${btn('取消','cancel-human')}${btn('提交请求','submit-human','primary')}</div>${err()}</div>`;
      if(state.rfqForm)return `<div class="chat-card"><h3>${state.rfqEdit?'编辑原 RFQ '+e(state.rfq.id):'发起 RFQ'}</h3><p>技术条件可以暂缺；提交时必须确认一个销售可回复的联系方式。</p><label>型号或待选型<input class="field" data-rfq="model" value="${e(state.rfqDraft.model)}"></label><label>数量<input class="field" data-rfq="quantity" value="${e(state.rfqDraft.quantity)}"></label><label>邮箱或电话 · 必填<input class="field" data-rfq="contact" value="${e(state.rfqDraft.contact)}"></label><label>其他说明<textarea class="field" data-rfq="notes" rows="2">${e(state.rfqDraft.notes)}</textarea></label>${err()}<div class="actions">${btn('取消','cancel-rfq')}${btn(state.rfqEdit?'保存原 RFQ':'确认联系方式并提交','submit-rfq','primary')}</div></div>`;
      return '';
    }
    const chat=()=>state.chatOpen?`<section class="chat" aria-label="演示官网聊天窗口"><div class="chat-head"><div><strong>产品咨询助手 · 演示</strong><small>在原官网页面对话 · RFQ 随时可发起</small></div>${btn('收起','close-chat')}</div><div class="chat-body" id="chat-body">${state.messages.length?state.messages.map(message).join(''):'<div class="bubble"><strong>产品助手</strong><p>你好，请描述产品用途或直接发起询价。已知型号也可以直接查看产品页。</p></div>'}${form()}</div><div class="chat-foot"><div class="quick">${btn('问资料内问题','ask-known')}${btn('问资料外问题','ask-unknown')}${btn('发起 RFQ','open-rfq')}</div><div class="send"><input id="chat-input" aria-label="输入需求" placeholder="描述用途、工况或问题" value="${e(state.chatDraft)}">${btn('发送','send','primary')}</div>${!state.humanForm&&!state.rfqForm?err():''}</div></section>`:'';
    const buyer=()=>`<div class="buyer-site"><div class="buyer-nav"><strong>示例工业品官网</strong>${btn(state.chatOpen?'聊天已打开':'打开产品咨询','open-chat')}</div><section class="buyer-hero"><h1>Find the right pump for your application</h1><p>这是接入聊天 API 的官网参考界面线稿。产品资料、推荐与询价仍需在正式实现中由平台 API 和数据库提供；此处仅验证交互顺序。</p><button data-action="open-chat">Open product chat</button><div class="mock"><strong>产品信息入口</strong><p>买家可从已知型号直接进入公开产品页，也可先在聊天窗口描述应用场景。</p><p><a href="../product-detail-concept/index.html?model=a" target="_blank" rel="noopener">独立打开示例泵 A 的产品页概念稿 ↗</a></p></div></section>${chat()}</div>`;
    function render(){$('#app').innerHTML=header()+(state.mode==='seller'?seller():buyer());const f=$('#fail');if(f)f.value=state.fail;const body=$('#chat-body');if(body)body.scrollTop=body.scrollHeight;}
    function navigate(page){state.error='';state.page=page;state.mode='seller';render()}
    function add(type,text='',revision=null,snapshot=null){state.messages.push({type,text,revision,snapshot})}
    function act(action){
      state.error='';
      if(action==='mode-seller'){state.mode='seller';render();return}
      if(action==='mode-buyer'){state.mode='buyer';render();return}
      if(action.startsWith('page-')){navigate(action.slice(5));return}
      if(action==='upload-demo'){state.source=true;navigate('review');return}
      if(action==='show-source'){state.error='线稿仅展示来源说明；正式产品需打开对应原文件和定位位置。';render();return}
      if(action==='approve'){if(!state.source){state.error='请先导入来源文件，再核准事实。';render();return}state.reviewed=true;navigate('publish');return}
      if(action==='check-preview'){if(!state.reviewed){state.error='先由授权人员核准可确认字段。';render();return}state.checked=true;render();return}
      if(action==='publish'){if(!state.checked){state.error='请先核对本次预览内容。';render();return}if(state.fail==='publish'){state.error='模拟发布失败：保留草稿，公开状态未改变。';render();return}state.published=true;render();return}
      if(action==='open-chat'){state.chatOpen=true;render();return}
      if(action==='close-chat'){state.chatOpen=false;render();return}
      if(action==='send'){const text=state.chatDraft.trim();if(!text){state.error='先输入需求或选择下面的操作。';render();return}add('buyer',text);state.chatDraft='';if(!state.messages.some(m=>m.type==='requirements')){add('assistant','我先整理了用途和工况，请核对下方摘要。');add('requirements')}else add('assistant','已记录你的补充。可继续修改需求卡，或随时发起 RFQ。');render();return}
      if(action==='confirm-req'){if(state.reqConfirmed&&!state.reqDirty&&state.messages.some(m=>m.type==='recommendation'&&m.revision===state.reqRevision)){render();return}state.reqConfirmed=true;state.reqDirty=false;state.reqRevision++;if(state.published){add('assistant','需求摘要已确认。下列比较只使用演示规则，实际适用性仍需核实。');add('recommendation','',state.reqRevision,{...state.req})}else add('assistant','需求已确认，但示例泵 A 尚未发布；目前不能给出匹配候选。');render();return}
      if(action==='ask-known'){add('buyer','这个型号的用途说明在哪里？');if(state.published)add('answer');else add('assistant','这个型号尚无已发布、可引用的资料，请先查看其他公开信息或请求人工核实。');render();return}
      if(action==='ask-unknown'){add('buyer','它能用于我的介质温度吗？');add('unknown');state.unknownAsked=true;render();return}
      if(action==='open-human'){state.humanForm=true;state.rfqForm=false;render();return}
      if(action==='cancel-human'){state.humanForm=false;render();return}
      if(action==='submit-human'){if(state.humanTask){state.humanForm=false;render();return}if(state.fail==='human'){state.error='模拟提交失败：问题保留，未创建人工任务。';render();return}state.humanTask={status:'待工程师处理'};state.humanForm=false;add('assistant','请求 T-001 已收到。工程师回复会显示在当前对话中；不会发送站外通知。');render();return}
      if(action==='publish-reply'){if(!state.humanTask||state.humanTask.status==='已答复'){state.error='当前任务已答复，不能重复发布。';render();return}const answer=state.humanDraft.trim();if(!answer){state.error='先填写工程师答复或追问。';render();return}if(state.fail==='reply'){state.error='模拟发布失败：草稿保留，买方尚未收到。';render();return}state.humanTask.status='已答复';add('human',answer);state.humanDraft='';render();return}
      if(action==='open-rfq'){state.rfqEdit=false;state.rfqForm=true;state.humanForm=false;render();return}
      if(action==='cancel-rfq'){state.rfqForm=false;render();return}
      if(action==='edit-rfq'){state.rfqEdit=true;state.rfqForm=true;state.rfqDraft={model:state.rfq.model,quantity:state.rfq.quantity,contact:state.rfq.contact,notes:state.rfq.notes};render();return}
      if(action==='submit-rfq'){if(!state.rfqDraft.contact.trim()){state.error='请确认至少一种可回复的邮箱或电话。';render();return}if(state.fail==='rfq'){state.error='模拟提交失败：表单保留，未生成或修改 RFQ。';render();return}if(state.rfqEdit){Object.assign(state.rfq,state.rfqDraft);state.rfq.revisions.push('买方更正：型号 '+state.rfq.model+'；数量 '+(state.rfq.quantity||'待补充'));}else{state.rfq={id:'RFQ-001',status:'待领取',...state.rfqDraft,revisions:['初次提交：联系方式已确认；数量 '+(state.rfqDraft.quantity||'待补充')]};add('rfq')}state.rfqForm=false;state.rfqEdit=false;render();return}
      if(action==='claim-rfq'){if(state.rfq){state.owner='演示销售';state.rfq.status='处理中'}render();return}
      if(action==='stop-contact'){state.stop=true;render();return}
    }
    document.addEventListener('click',ev=>{const page=ev.target.closest('[data-page]');if(page){navigate(page.dataset.page);return}const action=ev.target.closest('[data-action]');if(action)act(action.dataset.action)});
    document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='chat-input')state.chatDraft=t.value;if(t.id==='human-answer')state.humanDraft=t.value;if(t.dataset.req){state.req[t.dataset.req]=t.value;if(state.reqConfirmed)state.reqDirty=true}if(t.dataset.rfq)state.rfqDraft[t.dataset.rfq]=t.value});
    document.addEventListener('change',ev=>{if(ev.target.id==='fail')state.fail=ev.target.value;if(ev.target.dataset.req)render()});
    document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='chat-input'){ev.preventDefault();act('send')}});
    render();
  })();
  </script>
</body>
</html>
